<!doctype html>
<html lang="es-EC">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="%SEO_URL%" />
    <meta name="theme-color" content="#13201a" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Casa de Miriam" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hamburguesa de la casa de Casa de Miriam" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE%" />
    <meta name="geo.region" content="EC-L" />
    <meta name="geo.placename" content="Loja" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Sans:wght@400..600&display=swap"
    />
    <link rel="preload" as="image" href="/images/hero-2400.webp" imagesrcset="/images/hero-1200.webp 1200w, /images/hero-2400.webp 2400w" imagesizes="100vw" fetchpriority="high" />

    <!--SEO_JSONLD-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:Georgia,serif;background:#13201a;color:#f4eee3">
        <h1>Casa de Miriam — Restaurante en Loja, Ecuador</h1>
        <p>%SEO_ADDRESS% · Tel. 098 226 2262</p>
        <p>Activa JavaScript para ver la carta y reservar.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
